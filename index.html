<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050711" />
  <title>Kal El's Solar System Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-screen" hidden>
      <div class="loading-content">
        <h1>Kal El's Solar System</h1>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <p id="loading-text">Loading 0%</p>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" >
      <div class="start-card">
        <h1>Kal El's Solar System Simulation</h1>
        <button id="start-button">START</button>
      </div>
    </div>

    <!-- Main 3D canvas will be injected here -->
    <div id="canvas-container"></div>

    <!-- Top Mode Bar -->
    <div id="top-bar" hidden>
      <button class="mode-btn" data-mode="fly">Fly</button>
      <button class="mode-btn active" data-mode="explore">Explore</button>
      <button class="mode-btn" data-mode="modes">Modes</button>
      <button class="mode-btn" data-mode="setting">Setting</button>
    </div>

    <!-- Sub panels will be added dynamically -->
    <div id="sub-panel" hidden></div>

    <!-- Joystick + Up/Down (only visible in Fly / Moon Calendar) -->
    <div id="movement-ui" hidden>
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-thumb"></div>
        </div>
      </div>
      <div id="vertical-controls">
        <button id="btn-up" class="vert-btn">↑</button>
        <button id="btn-down" class="vert-btn">↓</button>
      </div>
    </div>

    <!-- Energy bar (only in Superman) -->
    <div id="energy-bar" hidden>
      <div id="energy-fill"></div>
      <span id="energy-text">100%</span>
    </div>

    <!-- Floating labels container -->
    <div id="label-layer"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
